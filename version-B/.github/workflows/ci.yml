name: CI

on:
  push:
    branches: [ version-b-dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend — Install & Syntax Check
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors python-dotenv pydantic requests

      - name: Check backend imports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOA_API_KEY: ${{ secrets.GOA_API_KEY }}
        run: |
          python -c "from backend.services.ai_service import generate_email_response; print('ai_service OK')"
          python -c "from backend.services.database_service import init_database; print('database_service OK')"
          python -c "from backend.services.thread_parser import parse_thread; print('thread_parser OK')"

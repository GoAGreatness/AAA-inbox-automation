name: CI

on:
  push:
    branches: [ version-b-dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend — Install & Syntax Check
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors python-dotenv pydantic requests pytest chromadb sentence-transformers

      - name: Run pytest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOA_API_KEY: ${{ secrets.GOA_API_KEY }}
        run: pytest tests/ -v
